/**/*:
  ros__parameters:
    broker:
      host: localhost
      port: 1883
    bridge:
      ros2mqtt:
        ros_topics:
          - /ros_bot_cmd/primitive
        /ros_bot_cmd/primitive:
          mqtt_topic: legobot_cmd/primitive
          primitive: true
          ros_type: std_msgs/msg/String
          advanced:
            ros:
              queue_size: 10
              qos:
                durability: auto
                reliability: auto
      mqtt2ros:
        mqtt_topics:
          - legobot_odom/primitive
        legobot_odom/primitive:
          ros_topic: /odom/primitive
          primitive: true
          ros_type: std_msgs/msg/String
          advanced:
            ros:
              queue_size: 10
              qos:
                durability: transient_local
                reliability: reliable